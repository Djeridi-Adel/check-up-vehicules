<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a73e8">
  <title>Parc 🚛 &amp; 🚻 — Admin</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/admin/admin-parc.css">
</head>
<body>

  <header class="admin-header">
    <h1>Parc 🚛 &amp; 🚻</h1>
    <div class="header-actions">
      <a href="admin.html" class="btn-secondary">← Tableau de bord</a>
    </div>
  </header>

  <main class="dashboard">

    <p id="parc-loading" class="loading">Vérification de l'accès...</p>

    <div id="parc-app" class="hidden">

      <section class="parc-panel">
        <h2>Ajouter un véhicule</h2>
        <div class="parc-form">
          <input type="text" id="parc-nom" placeholder="Nom (ex : Benne OM 3)">
          <input type="text" id="parc-immat" placeholder="Immatriculation / n° d'inventaire">
          <input type="text" id="parc-type" placeholder="Type (ex : Benne ordures ménagères)">
          <button id="parc-ajouter" class="btn-ajouter">Ajouter</button>
        </div>
        <div class="parc-actions-row">
          <button id="parc-importer" class="btn-secondary">⬇ Importer les véhicules du check-up</button>
        </div>
      </section>

      <div id="tp-app"></div>

    </div>

  </main>

  <script type="module" src="../js/admin/parc-liste.js"></script>

</body>
</html>
